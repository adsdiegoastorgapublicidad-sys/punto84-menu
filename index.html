<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Punto84 — Menú Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #00b4a6;
  --primary-light: #4dd9ce;
  --primary-dark: #007a72;
  --accent: #f5a623;
  --accent-light: #ffc85e;
  --accent-dark: #b8750d;
  --bg: #0a0e15;
  --bg-2: #0f141d;
  --bg-3: #161d28;
  --bg-4: #1e2a38;
  --bg-5: #2a3a4e;
  --text: #eef4ff;
  --text-dim: #a8bbd1;
  --text-mute: #5a6b80;
  --green: #2ecc71;
  --red: #e74c3c;
  --yellow: #f1c40f;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
body { padding-bottom:120px; }
body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 10% 10%, rgba(0,180,166,0.04) 0%, transparent 50%), radial-gradient(ellipse at 90% 90%, rgba(245,166,35,0.03) 0%, transparent 50%); pointer-events:none; z-index:0; }

.container { max-width:780px; margin:0 auto; position:relative; z-index:1; }

/* LOADING */
.loader { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.4s; }
.loader.hide { opacity:0; pointer-events:none; }
.loader-img { width:80px; height:80px; object-fit:contain; animation:pulse 1.5s ease infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.1);opacity:0.7} }

/* COVER */
.cover { position:relative; width:100%; height:200px; background:linear-gradient(135deg, var(--bg-4), var(--bg-3)); background-size:cover; background-position:center; overflow:hidden; }
.cover::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 0%, transparent 50%, rgba(10,14,21,0.6) 80%, var(--bg) 100%); }
.cover-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-mute); font-style:italic; font-size:14px; }

/* PROFILE BAR */
.profile-bar { padding:0 20px; margin-top:-50px; position:relative; z-index:2; display:flex; align-items:flex-end; gap:16px; }
.profile-img { width:96px; height:96px; border-radius:50%; background:var(--bg-3); border:4px solid var(--bg); background-size:cover; background-position:center; flex-shrink:0; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
.profile-img.empty { font-size:32px; }
.profile-info { flex:1; padding-bottom:6px; min-width:0; }
.profile-name { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.04em; color:var(--text); line-height:1.1; word-break:break-word; }
.profile-slogan { font-family:'Crimson Pro',serif; font-style:italic; font-size:13px; color:var(--text-dim); margin-top:2px; }

/* STATUS BAR */
.status-row { display:flex; align-items:center; gap:14px; padding:14px 20px; margin:14px 20px 0; background:var(--bg-2); border:1px solid var(--bg-4); border-radius:12px; flex-wrap:wrap; }
.status-dot-pub { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.status-dot-pub.open { background:var(--green); box-shadow:0 0 10px var(--green); animation:pulseG 2s ease infinite; }
.status-dot-pub.closed { background:var(--red); box-shadow:0 0 10px var(--red); }
@keyframes pulseG { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
.status-label { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:0.1em; }
.status-label.open { color:var(--green); }
.status-label.closed { color:var(--red); }
.status-time { color:var(--text-dim); font-size:12px; margin-left:auto; }

/* DESCRIPTION */
.description { padding:14px 20px; font-family:'Crimson Pro',serif; font-style:italic; font-size:14px; color:var(--text-dim); line-height:1.6; text-align:center; }

.welcome-strip { margin:14px 20px; padding:14px 18px; background:linear-gradient(135deg, rgba(0,180,166,0.08), rgba(0,180,166,0.02)); border:1px solid var(--primary-dark); border-left:3px solid var(--primary); border-radius:8px; font-family:'Crimson Pro',serif; font-style:italic; font-size:14px; color:var(--text); line-height:1.6; }

/* CATEGORY TABS */
.cat-tabs-wrap { position:sticky; top:0; background:var(--bg); padding:14px 0 10px; z-index:50; border-bottom:1px solid var(--bg-4); }
.cat-tabs-wrap::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, var(--primary-dark), var(--primary), var(--accent), var(--accent-dark)); }
.cat-tabs { display:flex; gap:8px; padding:0 20px; overflow-x:auto; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
.cat-tabs::-webkit-scrollbar { display:none; }
.cat-tab { flex-shrink:0; padding:8px 16px; background:var(--bg-3); border:1px solid var(--bg-4); border-radius:20px; font-size:13px; font-weight:500; color:var(--text-dim); cursor:pointer; transition:all 0.2s; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.cat-tab:hover { border-color:var(--primary-dark); color:var(--text); }
.cat-tab.active { background:var(--primary); border-color:var(--primary); color:#012e29; font-weight:600; }

/* PRODUCTS SECTION */
.cat-section { padding:24px 20px 8px; scroll-margin-top:80px; }
.cat-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.08em; color:var(--accent); margin-bottom:14px; display:flex; align-items:center; gap:10px; line-height:1; }
.cat-emoji { font-size:24px; }
.cat-line { flex:1; height:1px; background:linear-gradient(90deg, var(--accent-dark), transparent); margin-left:6px; }

.products-list { display:flex; flex-direction:column; gap:12px; }
.product-item { background:var(--bg-2); border:1px solid var(--bg-4); border-radius:12px; overflow:hidden; display:flex; gap:12px; padding:12px; transition:all 0.2s; cursor:pointer; align-items:stretch; }
.product-item:hover { border-color:var(--primary-dark); transform:translateY(-1px); }
.product-item.unavailable { opacity:0.55; cursor:not-allowed; }
.product-img { width:90px; height:90px; border-radius:8px; background:var(--bg-3); background-size:cover; background-position:center; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center; }
.product-img.no-img { color:var(--text-mute); font-size:28px; }
.product-info { flex:1; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
.product-top {}
.product-name-pub { font-size:15px; font-weight:600; color:var(--text); line-height:1.3; margin-bottom:4px; }
.product-desc-pub { font-family:'Crimson Pro',serif; font-style:italic; font-size:13px; color:var(--text-dim); line-height:1.4; }
.product-bot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
.product-price-pub { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.04em; color:var(--accent); }
.product-add { background:var(--primary); border:none; color:#012e29; width:32px; height:32px; border-radius:50%; font-size:18px; font-weight:bold; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.product-add:hover { background:var(--primary-light); transform:scale(1.1); }
.product-add:active { transform:scale(0.95); }
.product-add.in-cart { background:var(--accent); color:#3a1c00; }
.unavailable-badge { display:inline-block; background:var(--red); color:#fff; padding:2px 8px; border-radius:4px; font-size:10px; letter-spacing:0.1em; font-weight:600; text-transform:uppercase; margin-left:6px; }

/* EMPTY MENU */
.empty-menu { padding:60px 30px; text-align:center; color:var(--text-mute); }
.empty-menu-icon { font-size:48px; margin-bottom:14px; opacity:0.5; }
.empty-menu-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.1em; color:var(--text-dim); margin-bottom:6px; }
.empty-menu-text { font-family:'Crimson Pro',serif; font-style:italic; font-size:14px; line-height:1.5; }

/* CART FLOATING */
.cart-fab { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--primary); color:#012e29; border:none; border-radius:50px; padding:14px 24px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.1em; cursor:pointer; box-shadow:0 8px 30px rgba(0,180,166,0.4), 0 0 0 0 rgba(0,180,166,0.4); display:flex; align-items:center; gap:12px; z-index:80; transition:all 0.3s; opacity:0; pointer-events:none; transform:translateX(-50%) translateY(20px); }
.cart-fab.visible { opacity:1; pointer-events:all; transform:translateX(-50%) translateY(0); animation:cartPulse 2s ease infinite; }
@keyframes cartPulse { 0%,100% { box-shadow:0 8px 30px rgba(0,180,166,0.4), 0 0 0 0 rgba(0,180,166,0.4); } 50% { box-shadow:0 8px 30px rgba(0,180,166,0.4), 0 0 0 12px rgba(0,180,166,0); } }
.cart-fab:active { transform:translateX(-50%) scale(0.96); }
.cart-fab-count { background:#012e29; color:var(--primary); padding:3px 10px; border-radius:12px; font-size:14px; min-width:24px; text-align:center; }
.cart-fab-total { font-size:15px; letter-spacing:0.05em; }

/* CART MODAL */
.cart-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:200; opacity:0; pointer-events:none; transition:opacity 0.3s; backdrop-filter:blur(8px); display:flex; align-items:flex-end; justify-content:center; }
.cart-modal.active { opacity:1; pointer-events:all; }
.cart-box { background:var(--bg-2); border-top:1px solid var(--bg-5); border-radius:20px 20px 0 0; width:100%; max-width:780px; max-height:92vh; overflow-y:auto; transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display:flex; flex-direction:column; }
.cart-modal.active .cart-box { transform:translateY(0); }
.cart-header { padding:16px 20px; border-bottom:1px solid var(--bg-4); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--bg-2); z-index:5; }
.cart-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.08em; color:var(--primary); }
.cart-close { background:var(--bg-3); border:1px solid var(--bg-4); color:var(--text-dim); width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; }
.cart-content { padding:18px 20px; flex:1; }

/* CART ITEM */
.cart-item { background:var(--bg-3); border:1px solid var(--bg-4); border-radius:10px; padding:12px; display:flex; gap:10px; margin-bottom:10px; }
.cart-item-img { width:60px; height:60px; border-radius:8px; background:var(--bg-4); background-size:cover; background-position:center; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--text-mute); font-size:20px; }
.cart-item-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.cart-item-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.cart-item-name { font-size:14px; font-weight:600; color:var(--text); }
.cart-item-price { font-family:'Bebas Neue',sans-serif; font-size:15px; color:var(--accent); white-space:nowrap; }
.cart-item-note { font-family:'Crimson Pro',serif; font-style:italic; font-size:12px; color:var(--text-mute); }
.cart-item-note-input { width:100%; background:var(--bg); border:1px solid var(--bg-5); border-radius:6px; padding:6px 10px; font-size:12px; color:var(--text); outline:none; margin-top:4px; font-family:'DM Sans',sans-serif; }
.cart-item-note-input::placeholder { color:var(--text-mute); font-style:italic; }
.cart-item-note-input:focus { border-color:var(--primary-dark); }
.qty-controls { display:flex; align-items:center; gap:8px; margin-top:6px; }
.qty-btn { background:var(--bg); border:1px solid var(--bg-5); color:var(--text); width:28px; height:28px; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.qty-btn:hover { border-color:var(--primary-dark); color:var(--primary); }
.qty-btn.danger:hover { border-color:var(--red); color:var(--red); }
.qty-num { font-family:'Bebas Neue',sans-serif; font-size:16px; min-width:24px; text-align:center; color:var(--text); }

/* CART FORM */
.cart-section-title { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.15em; color:var(--primary); text-transform:uppercase; margin:20px 0 10px; display:flex; align-items:center; gap:8px; }
.field-pub { margin-bottom:12px; }
.field-pub label { display:block; font-size:11px; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:5px; font-weight:600; }
.field-pub input, .field-pub textarea, .field-pub select { width:100%; background:var(--bg); border:1.5px solid var(--bg-5); border-radius:8px; padding:11px 14px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text); outline:none; }
.field-pub input:focus, .field-pub textarea:focus, .field-pub select:focus { border-color:var(--primary-dark); }
.field-pub.error input, .field-pub.error textarea, .field-pub.error select { border-color:var(--red); }
.field-pub textarea { min-height:60px; resize:vertical; font-family:inherit; }
.field-pub .err { display:none; font-size:11px; color:var(--red); margin-top:4px; }
.field-pub.error .err { display:block; }

/* TOTALS */
.totals { background:var(--bg-3); border:1px solid var(--bg-4); border-radius:10px; padding:14px 16px; margin-top:14px; }
.total-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
.total-row.divider { border-bottom:1px dashed var(--bg-4); padding-bottom:10px; margin-bottom:6px; }
.total-row.grand { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.04em; color:var(--accent); padding-top:8px; border-top:1px solid var(--bg-4); margin-top:4px; }
.total-row.grand .label { color:var(--text); }

/* SEND BUTTON */
.btn-send { width:100%; background:#25d366; color:#fff; border:none; border-radius:10px; padding:16px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.1em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:all 0.2s; margin-top:18px; box-shadow:0 6px 20px rgba(37,211,102,0.3); }
.btn-send:hover { background:#1eb858; transform:translateY(-1px); }
.btn-send:active { transform:scale(0.98); }
.btn-send:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* CLOSED ALERT */
.closed-alert { background:rgba(231,76,60,0.1); border:1px solid var(--red); border-radius:10px; padding:14px; text-align:center; margin-top:16px; }
.closed-alert-title { font-family:'Bebas Neue',sans-serif; font-size:16px; color:var(--red); letter-spacing:0.08em; }
.closed-alert-sub { font-size:12px; color:var(--text-dim); margin-top:4px; font-family:'Crimson Pro',serif; font-style:italic; }

/* FOOTER */
footer { padding:30px 20px; text-align:center; color:var(--text-mute); font-size:11px; border-top:1px solid var(--bg-4); margin-top:30px; }
footer strong { color:var(--accent-dark); }

/* PRODUCT DETAIL MODAL */
.prod-modal { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:300; opacity:0; pointer-events:none; transition:opacity 0.3s; backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:16px; }
.prod-modal.active { opacity:1; pointer-events:all; }
.prod-modal-box { background:var(--bg-2); border:1px solid var(--bg-5); border-radius:16px; max-width:440px; width:100%; max-height:92vh; overflow-y:auto; transform:scale(0.85); transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); position:relative; }
.prod-modal.active .prod-modal-box { transform:scale(1); }
.prod-modal-close { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.2); color:#fff; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; z-index:5; backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; }
.prod-modal-close:hover { background:rgba(231,76,60,0.8); border-color:var(--red); }
.prod-modal-img { width:100%; aspect-ratio:1/1; background:var(--bg-3); background-size:cover; background-position:center; border-radius:16px 16px 0 0; display:flex; align-items:center; justify-content:center; color:var(--text-mute); font-size:64px; position:relative; }
.prod-modal-img::after { content:''; position:absolute; bottom:0; left:0; right:0; height:60px; background:linear-gradient(180deg, transparent, var(--bg-2)); }
.prod-modal-body { padding:20px 22px 22px; }
.prod-modal-name { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:0.04em; color:var(--text); line-height:1.1; margin-bottom:6px; }
.prod-modal-price-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
.prod-modal-price { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:0.04em; color:var(--accent); }
.prod-modal-cat { font-size:11px; letter-spacing:0.15em; color:var(--text-dim); text-transform:uppercase; background:var(--bg-3); padding:4px 10px; border-radius:12px; border:1px solid var(--bg-4); }
.prod-modal-desc { font-family:'Crimson Pro',serif; font-style:italic; font-size:15px; color:var(--text-dim); line-height:1.6; margin-bottom:18px; padding:14px; background:var(--bg-3); border-radius:10px; border-left:3px solid var(--primary); }
.prod-modal-actions { display:flex; gap:10px; align-items:center; }
.prod-modal-qty { display:flex; align-items:center; gap:10px; background:var(--bg-3); border:1px solid var(--bg-4); border-radius:10px; padding:6px 8px; }
.prod-modal-qty-btn { background:transparent; border:none; color:var(--text); width:32px; height:32px; border-radius:6px; font-size:18px; font-weight:bold; cursor:pointer; transition:all 0.15s; }
.prod-modal-qty-btn:hover { background:var(--bg-4); color:var(--primary); }
.prod-modal-qty-num { font-family:'Bebas Neue',sans-serif; font-size:20px; min-width:30px; text-align:center; color:var(--text); }
.btn-add-cart { flex:1; background:var(--primary); color:#012e29; border:none; border-radius:10px; padding:14px; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:0.1em; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-add-cart:hover { background:var(--primary-light); }
.btn-add-cart:active { transform:scale(0.97); }
.prod-modal-unavailable { background:rgba(231,76,60,0.1); border:1px solid var(--red); border-radius:10px; padding:12px; text-align:center; color:var(--red); font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:0.08em; }

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--bg-5); border-radius:3px; }

@media (min-width:780px) {
  .cover { height:280px; border-radius:0 0 16px 16px; margin-top:14px; }
  .container { padding:0; }
  body { background:#000; }
  .container { background:var(--bg); min-height:100vh; }
}

/* Empty cart */
.empty-cart { padding:40px 20px; text-align:center; color:var(--text-mute); }
.empty-cart-icon { font-size:48px; margin-bottom:12px; opacity:0.4; }
.empty-cart-msg { font-family:'Crimson Pro',serif; font-style:italic; font-size:14px; }
</style>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const FB = {apiKey:"AIzaSyARPjPpiqLN_QwFfQjEJHo36-EQdeQOwfM",authDomain:"punto84-raspadito.firebaseapp.com",databaseURL:"https://punto84-raspadito-default-rtdb.firebaseio.com",projectId:"punto84-raspadito",storageBucket:"punto84-raspadito.firebasestorage.app",messagingSenderId:"201750862105",appId:"1:201750862105:web:68b74ee7a2a9ee43088d88"};
const app = initializeApp(FB);
const db = getDatabase(app);

const DAYS_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAYS_NAMES = {mon:'Lunes',tue:'Martes',wed:'Miércoles',thu:'Jueves',fri:'Viernes',sat:'Sábado',sun:'Domingo'};

let menuData = { local:{}, design:{primary:'#00b4a6',accent:'#f5a623'}, categories:[], products:[], zones:[], hours:{}, config:{whatsapp:'+56938902407',isOpen:false} };

function processDriveUrl(url) {
  if(!url) return '';
  url = url.trim();
  const m1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  const id = m1 ? m1[1] : (m2 ? m2[1] : null);
  if(id) return 'https://lh3.googleusercontent.com/d/' + id + '=w800';
  return url;
}

function formatPrice(n) {
  return '$' + (n||0).toLocaleString('es-CL');
}

// LOAD DATA
async function loadMenu() {
  try {
    const snap = await get(ref(db, 'menu'));
    if(snap.exists()) {
      const d = snap.val();
      menuData.local = d.local || {};
      menuData.design = d.design || {primary:'#00b4a6',accent:'#f5a623'};
      menuData.categories = d.categories ? Object.values(d.categories) : [];
      menuData.products = d.products ? Object.values(d.products) : [];
      menuData.zones = d.zones ? Object.values(d.zones) : [];
      menuData.hours = d.hours || {};

  } catch(e) {

  }

  // Realtime updates
  onValue(ref(db, 'menu'), snap => {

      const d = snap.val();
      menuData.local = d.local || {};
      menuData.design = d.design || {primary:'#00b4a6',accent:'#f5a623'};
      menuData.categories = d.categories ? Object.values(d.categories) : [];
      menuData.products = d.products ? Object.values(d.products) : [];
      menuData.zones = d.zones ? Object.values(d.zones) : [];
      menuData.hours = d.hours || {};
      menuData.config = d.config || {whatsapp:'+56938902407', isOpen:false};
      applyDesign();
      renderAll();

}

function applyDesign() {
  const root = document.documentElement;
  root.style.setProperty('--primary', menuData.design.primary);
  root.style.setProperty('--accent', menuData.design.accent);
  // Lighten/darken variants - simple approximation
  root.style.setProperty('--primary-dark', shadeColor(menuData.design.primary, -25));
  root.style.setProperty('--primary-light', shadeColor(menuData.design.primary, 30));
  root.style.setProperty('--accent-dark', shadeColor(menuData.design.accent, -25));
  root.style.setProperty('--accent-light', shadeColor(menuData.design.accent, 30));
}

function shadeColor(color, percent) {
  let R = parseInt(color.substring(1,3),16);
  let G = parseInt(color.substring(3,5),16);
  let B = parseInt(color.substring(5,7),16);
  R = parseInt(R * (100 + percent) / 100);
  G = parseInt(G * (100 + percent) / 100);
  B = parseInt(B * (100 + percent) / 100);
  R = Math.min(255, Math.max(0, R));
  G = Math.min(255, Math.max(0, G));
  B = Math.min(255, Math.max(0, B));
  const RR = ((R.toString(16).length===1)?'0'+R.toString(16):R.toString(16));
  const GG = ((G.toString(16).length===1)?'0'+G.toString(16):G.toString(16));
  const BB = ((B.toString(16).length===1)?'0'+B.toString(16):B.toString(16));
  return '#'+RR+GG+BB;
}

function renderAll() {
  renderHeader();
  renderStatus();
  renderMenu();
  updateCartUI();
}

function getSantiagoNow() {
  // Always use America/Santiago regardless of client device timezone
  const now = new Date();
  const santiago = new Date(now.toLocaleString('en-US', { timeZone: 'America/Santiago' }));
  return santiago;
}

function isLocalOpen() {
  if(!menuData.config.isOpen) return false;
  const now = getSantiagoNow();
  const dayKey = DAYS_KEYS[now.getDay()];
  const todayHours = menuData.hours[dayKey];
  if(!todayHours || !todayHours.open) return false;
  const nowMin = now.getHours()*60 + now.getMinutes();
  const [fH, fM] = (todayHours.from||'00:00').split(':').map(Number);
  const [tH, tM] = (todayHours.to||'00:00').split(':').map(Number);
  const fMin = fH*60 + fM;
  const tMin = tH*60 + tM;
  // handle past-midnight closing
  if(tMin < fMin) {
    return nowMin >= fMin || nowMin <= tMin;
  }
  return nowMin >= fMin && nowMin <= tMin;
}

function renderStatus() {
  const isOpen = isLocalOpen();
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  const time = document.getElementById('statusTime');
  if(isOpen) {
    dot.className = 'status-dot-pub open';
    label.className = 'status-label open';
    label.textContent = '● ABIERTO';
    const now = getSantiagoNow();
    const dayKey = DAYS_KEYS[now.getDay()];
    const th = menuData.hours[dayKey];
    if(th && th.open) time.textContent = 'Hasta las ' + th.to + ' hrs';
  } else {
    dot.className = 'status-dot-pub closed';
    label.className = 'status-label closed';
    label.textContent = '● CERRADO';
    const now = getSantiagoNow();
    let nextDay = '';
    for(let i=1;i<=7;i++) {
      const dk = DAYS_KEYS[(now.getDay()+i)%7];
      if(menuData.hours[dk] && menuData.hours[dk].open) {
        nextDay = (i===1?'Mañana':DAYS_NAMES[dk])+' a las '+menuData.hours[dk].from+' hrs';
        break;
      }
    }
    time.textContent = nextDay ? 'Abrimos: '+nextDay : '';
  }
}

function renderMenu() {
  const content = document.getElementById('menuContent');
  const tabsWrap = document.getElementById('catTabsWrap');
  const tabsEl = document.getElementById('catTabs');

  if(!menuData.categories.length || !menuData.products.length) {

    return;
  }

  // Tabs
  tabsWrap.style.display = 'block';
  tabsEl.innerHTML = '';
  let firstWithProducts = null;
  menuData.categories.forEach(cat => {
    const prods = menuData.products.filter(p => p.catId === cat.id);

    const tab = document.createElement('div');

    tab.innerHTML = '<span>'+(cat.emoji||'🍕')+'</span><span>'+(cat.name||'')+'</span>';

  }

  // Sections
  content.innerHTML = '';
  menuData.categories.forEach(cat => {

    content.appendChild(sec);
    const list = sec.querySelector('.products-list');
    prods.forEach(p => {
      const item = document.createElement('div');
      item.className = 'product-item'+(p.available===false?' unavailable':'');
      item.dataset.prod = p.id;
      const img = processDriveUrl(p.img);
      const inCart = cart.find(c => c.id === p.id);

        '<div class="product-img'+(img?'':' no-img')+'" '+(img?'style="background-image:url('+img+')"':'')+'>'+(img?'':'📷')+'</div>'+
        '<div class="product-info"><div class="product-top"><div class="product-name-pub">'+(p.name||'Sin nombre')+(p.available===false?'<span class="unavailable-badge">Agotado</span>':'')+'</div>'+(p.description?'<div class="product-desc-pub">'+p.description+'</div>':'')+'</div>'+
        '<div class="product-bot"><div class="product-price-pub">'+formatPrice(p.price)+'</div>'+
        (p.available===false?'':'<button class="product-add'+(inCart?' in-cart':'')+'" data-add="'+p.id+'">'+(inCart?'✓':'+')+'</button>')+
        '</div></div>';
      list.appendChild(item);
    });
  });

  content.querySelectorAll('.product-item').forEach(item => {
    item.addEventListener('click', e => {
      if(e.target.closest('[data-add]')) return; // ignore if + button clicked
      const prodId = item.dataset.prod;
      if(prodId) openProductDetail(prodId);
    });
  });
  content.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    addToCart(b.dataset.add);
  }));
}

// PRODUCT DETAIL MODAL
function openProductDetail(prodId) {
  const p = menuData.products.find(x => x.id === prodId);
  if(!p) return;
  const cat = menuData.categories.find(c => c.id === p.catId);

  const img = processDriveUrl(p.img);
  const imgEl = document.getElementById('prodModalImg');
  if(img) {
    imgEl.style.backgroundImage = 'url('+img+')';
    imgEl.innerHTML = '';
  } else {
    imgEl.style.backgroundImage = '';
    imgEl.innerHTML = '📷';
  }

  document.getElementById('prodModalName').textContent = p.name || 'Sin nombre';
  document.getElementById('prodModalPrice').textContent = formatPrice(p.price);
  document.getElementById('prodModalCat').textContent = cat ? ((cat.emoji||'') + ' ' + (cat.name||'')) : '';
  const descEl = document.getElementById('prodModalDesc');
  if(p.description) {
    descEl.textContent = p.description;
    descEl.style.display = 'block';
  } else {
    descEl.style.display = 'none';
  }

  const actionsEl = document.getElementById('prodModalActions');
  if(p.available === false) {
    actionsEl.innerHTML = '<div class="prod-modal-unavailable">⚠ PRODUCTO AGOTADO</div>';
  } else {
    const inCart = cart.find(c => c.id === prodId);
    const qty = inCart ? inCart.qty : 1;
    actionsEl.innerHTML =
      '<div class="prod-modal-actions">'+
        '<div class="prod-modal-qty">'+
          '<button class="prod-modal-qty-btn" id="pmQtyMinus">−</button>'+
          '<span class="prod-modal-qty-num" id="pmQtyNum">'+qty+'</span>'+
          '<button class="prod-modal-qty-btn" id="pmQtyPlus">+</button>'+
        '</div>'+
        '<button class="btn-add-cart" id="pmAddCart">'+
          '<span>🛒</span>'+
          '<span id="pmAddText">'+(inCart?'ACTUALIZAR PEDIDO':'AGREGAR AL PEDIDO')+'</span>'+
        '</button>'+
      '</div>';

    let currentQty = qty;
    const updateQtyUI = () => {
      document.getElementById('pmQtyNum').textContent = currentQty;
    };
    document.getElementById('pmQtyMinus').addEventListener('click', () => {
      if(currentQty > 1) { currentQty--; updateQtyUI(); }
    });
    document.getElementById('pmQtyPlus').addEventListener('click', () => {
      currentQty++; updateQtyUI();
      if(navigator.vibrate) navigator.vibrate(20);
    });
    document.getElementById('pmAddCart').addEventListener('click', () => {
      const existing = cart.find(c => c.id === prodId);
      if(existing) {
        existing.qty = currentQty;
      } else {
        cart.push({id:prodId, name:p.name, price:p.price, img:p.img, qty:currentQty, note:''});
      }
      saveCart();
      updateCartUI();
      renderMenu();
      closeProductDetail();
      if(navigator.vibrate) navigator.vibrate(40);
    });
  }

  document.getElementById('prodModal').classList.add('active');
}

function closeProductDetail() {
  document.getElementById('prodModal').classList.remove('active');
}

document.getElementById('prodModalClose').addEventListener('click', closeProductDetail);
document.getElementById('prodModal').addEventListener('click', e => {
  if(e.target.id === 'prodModal') closeProductDetail();
});

// CART
function addToCart(prodId) {
  const p = menuData.products.find(x => x.id === prodId);
  if(!p || p.available === false) return;
  const existing = cart.find(c => c.id === prodId);
  if(existing) existing.qty++;
  else cart.push({id:prodId, name:p.name, price:p.price, img:p.img, qty:1, note:''});
  saveCart();
  updateCartUI();
  renderMenu();
  // bounce feedback
  if(navigator.vibrate) navigator.vibrate(30);
}

function removeFromCart(prodId) {
  cart = cart.filter(c => c.id !== prodId);
  saveCart();
  updateCartUI();
  renderMenu();
  if(cart.length === 0) document.getElementById('cartModal').classList.remove('active');
}

function changeQty(prodId, delta) {
  const item = cart.find(c => c.id === prodId);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) { removeFromCart(prodId); return; }
  saveCart();
  updateCartUI();
}

function updateNote(prodId, note) {
  const item = cart.find(c => c.id === prodId);
  if(!item) return;
  item.note = note;
  saveCart();
}

function saveCart() {
  localStorage.setItem('p84cart', JSON.stringify(cart));
}

function loadCart() {
  try {
    const c = localStorage.getItem('p84cart');
    if(c) cart = JSON.parse(c);
  } catch(e) { cart = []; }
}

function cartSubtotal() {
  return cart.reduce((s,i) => s + (i.price * i.qty), 0);
}

function cartTotal() {
  return cartSubtotal() + (selectedZone ? selectedZone.price : 0);
}

function updateCartUI() {
  const fab = document.getElementById('cartFab');
  const count = cart.reduce((s,i) => s + i.qty, 0);
  if(count > 0) {
    fab.classList.add('visible');
    document.getElementById('cartCount').textContent = count;
    document.getElementById('cartFabTotal').textContent = formatPrice(cartSubtotal());
  } else {
    fab.classList.remove('visible');
  }
}

  html += '<button class="btn-send" id="btnSend">'+

    'ENVIAR PEDIDO POR WHATSAPP</button>';

  content.innerHTML = html;

  // Bind events
  content.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', () => { changeQty(b.dataset.plus, 1); renderCart(); }));
  content.querySelectorAll('[data-minus]').forEach(b => b.addEventListener('click', () => { changeQty(b.dataset.minus, -1); renderCart(); }));
  content.querySelectorAll('[data-note]').forEach(inp => inp.addEventListener('input', () => updateNote(inp.dataset.note, inp.value)));

  const zoneSel = document.getElementById('custZone');
  if(zoneSel) zoneSel.addEventListener('change', () => {
    const idx = zoneSel.value;
    selectedZone = idx === '' ? null : menuData.zones[+idx];
    renderCart();
  });

  document.getElementById('btnSend').addEventListener('click', sendOrder);
}

async function sendOrder() {
  let valid = true;
  const name = document.getElementById('custName').value.trim();
  const addr = document.getElementById('custAddr').value.trim();
  const notes = (document.getElementById('custNotes') ? document.getElementById('custNotes').value.trim() : '');

  if(!name) { document.querySelector('#custName').closest('.field-pub').classList.add('error'); valid = false; }
  else document.querySelector('#custName').closest('.field-pub').classList.remove('error');

  if(!addr) { document.querySelector('#custAddr').closest('.field-pub').classList.add('error'); valid = false; }
  else document.querySelector('#custAddr').closest('.field-pub').classList.remove('error');

  if(menuData.zones.length && !selectedZone) {
    document.querySelector('#custZone').closest('.field-pub').classList.add('error');
    valid = false;
  } else if(menuData.zones.length) document.querySelector('#custZone').closest('.field-pub').classList.remove('error');

  if(!valid) return;

  // Save customer data for next time
  localStorage.setItem('p84_name', name);
  localStorage.setItem('p84_addr', addr);

  // Build receipt
  const brandName = menuData.local.name || 'PUNTO84';
  let msg = '*📋 NUEVO PEDIDO — ' + brandName.toUpperCase() + '*\n';
  msg += '━━━━━━━━━━━━━━━━━━━━━━━\n';
  msg += '👤 *Cliente:* ' + name + '\n';
  msg += '📍 *Dirección:* ' + addr + '\n';
  if(selectedZone) msg += '🛵 *Zona:* ' + selectedZone.name + '\n';
  msg += '━━━━━━━━━━━━━━━━━━━━━━━\n';
  msg += '🛒 *DETALLE DEL PEDIDO:*\n\n';

  cart.forEach(item => {
    const lineTotal = item.price * item.qty;
    msg += '• ' + item.qty + 'x ' + item.name + '\n';
    msg += '   ' + formatPrice(item.price) + ' c/u → *' + formatPrice(lineTotal) + '*\n';
    if(item.note && item.note.trim()) msg += '   📝 _' + item.note.trim() + '_\n';
    msg += '\n';
  });

  msg += '━━━━━━━━━━━━━━━━━━━━━━━\n';
  msg += 'Subtotal: ' + formatPrice(cartSubtotal()) + '\n';
  if(selectedZone) {
    msg += 'Delivery (' + selectedZone.name + '): ' + formatPrice(selectedZone.price) + '\n';
    msg += '━━━━━━━━━━━━━━━━━━━━━━━\n';
    msg += '💰 *TOTAL: ' + formatPrice(cartTotal()) + '*\n';
  } else {
    msg += '━━━━━━━━━━━━━━━━━━━━━━━\n';
    msg += '💰 *TOTAL: ' + formatPrice(cartSubtotal()) + '*\n';
  }

  if(notes) {
    msg += '━━━━━━━━━━━━━━━━━━━━━━━\n';
    msg += '📝 *Notas adicionales:*\n' + notes + '\n';
  }

  msg += '━━━━━━━━━━━━━━━━━━━━━━━\n';
  const now = getSantiagoNow();
  msg += '⏰ Enviado: ' + now.toLocaleString('es-CL', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});

  const phone = (menuData.config.whatsapp || '+56938902407').replace(/[^0-9]/g,'');
  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);

  // Save order to Firebase
  try {
    const orderData = {
      customer: { name, address: addr, zone: selectedZone ? selectedZone.name : 'Sin zona' },
      items: cart.map(i => ({ name:i.name, qty:i.qty, price:i.price, note:i.note||'' })),
      subtotal: cartSubtotal(),
      delivery: selectedZone ? { zone:selectedZone.name, price:selectedZone.price } : null,
      total: cartTotal(),
      notes: notes || '',
      status: 'pending',
      timestamp: Date.now(),
      date: getSantiagoNow().toISOString().split('T')[0],
      time: getSantiagoNow().toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit'}),
    };
    await push(ref(db, 'menu/orders'), orderData);
  } catch(e) { console.error('Order save error:', e); }

  // Clear cart after sending
  cart = [];
  saveCart();
  updateCartUI();
  document.getElementById('cartModal').classList.remove('active');

  window.open(url, '_blank');
}

// CART MODAL
document.getElementById('cartFab').addEventListener('click', () => {
  renderCart();
  document.getElementById('cartModal').classList.add('active');
});
document.getElementById('cartCloseBtn').addEventListener('click', () => document.getElementById('cartModal').classList.remove('active'));
document.getElementById('cartModal').addEventListener('click', e => {
  if(e.target.id === 'cartModal') document.getElementById('cartModal').classList.remove('active');
});

// INIT
loadCart();
loadMenu();

// Refresh status every minute
setInterval(renderStatus, 60000);
</script>
</body>
